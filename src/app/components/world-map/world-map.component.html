
<div class="world-map-container countries-selected-scroll" [class.country-selected]="isCountryLocked">
  <!-- Search input -->
<div class="search-container" style="width: 100%; display: flex; justify-content: center; margin-bottom: 1rem;">
  <div class="search-wrapper">
    <input
      type="text"
      class="country-search"
      [(ngModel)]="searchQuery"
      (input)="filterCountries()"
      (focus)="onSearchFocus()"
      placeholder="Search for a country..." />

    <button
      *ngIf="searchQuery"
      class="clear-button"
      (click)="clearSearch()"
      title="Clear search">
      ×
    </button>

    <div class="search-dropdown" *ngIf="isDropdownOpen && filteredCountries.length">
      <div
        *ngFor="let country of filteredCountries"
        class="dropdown-item"
        (click)="selectCountry(country.key)">
        {{ country.value.name }}
      </div>
    </div>
  </div>
</div>


  <!-- Logo displayed at center top when a country is selected -->
  <img *ngIf="isCountryLocked"
       src="assets/img/logo-sises.svg"
       alt="Sises Logo"
       class="sises-logo" />

  <!-- Loader -->
  <div class="loader" *ngIf="!svgContent">
    <div class="spinner"></div>
    <p>Loading interactive world map...</p>
  </div>

  <!-- The map will be inserted here -->
  <div id="world-map" [innerHTML]="svgContent | safeHtml"></div>

  <!-- Simplified Tooltip -->
  <div class="country-tooltip"
       *ngIf="showTooltip && selectedCountry"
       [style.left.px]="tooltipX"
       [style.top.px]="tooltipY"
       [@fadeInOut]="true">
    <div class="tooltip-header">
      <button class="close-button"
              (click)="closeTooltip($event)"
              (mousedown)="$event.stopPropagation()"
              (mouseup)="$event.stopPropagation()"
              (mouseover)="$event.stopPropagation()"
              (mouseenter)="$event.stopPropagation()"
              (mouseleave)="$event.stopPropagation()"
              *ngIf="isCountryLocked"
              title="Close country details">
        ×
      </button>
    </div>

    <div class="tooltip-content">
      <h1 class="country-name">{{ selectedCountry.name }} <br><p class="country-information">INFORMATION</p></h1>
      <p class="country-description">{{ selectedCountry.description }}</p>

      <div class="tooltip-actions" *ngIf="isCountryLocked">
        <button class="action-button primary" (click)="exploreMore()">
          VOIR PLUS
        </button>
      </div>
    </div>
  </div>
</div>
