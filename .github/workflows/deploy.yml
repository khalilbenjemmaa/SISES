name: Deploy to GitHub Pages

on:
  push:
    branches:
      - VERSION2-SISES  # Trigger the workflow on push to the 'VERSION2-SISES' branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.19.1'  # Set Node.js version to match Angular requirements

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Build the Angular application with base-href
      - name: Build Angular app
        run: npm run build -- --configuration production --base-href /

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        run: |
          # Configure Git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Deploy to GitHub Pages using the PAT
          npx angular-cli-ghpages --dir=dist/SISES --no-silent --repo=https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/khalilbenjemmaa/SISES.git

        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Use the new secret for authentication


